<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<body>
    <h1>Registro de la Fuerza</h1>

    <form action="/registro" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Luke Skywalker">
                </td>
                <td>
                    <label for="apellido">Apellido</label><br>
                    <input type="text" id="apellido" name="apellido">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password">
                </td>
                <td>
                    <label for="password_confirm">Confirmar Password</label><br>
                    <input type="password" id="password_confirm" name="password_confirm">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad</label><br>
                    <input type="number" id="edad" name="edad">
                </td>
                <td>
                    <label for="nivel">Nivel de la Fuerza</label><br>
                    <input 
                        type="number" 
                        id="nivel" 
                        name="nivel" 
                        min="10" 
                        max="100" 
                        value="50" 
                        step="5"
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <p>Selecciona tu bando:</p>
                    <input type="radio" id="jedi" name="bando" value="jedi">
                    <label for="jedi">Jedi</label>

                    <input type="radio" id="sith" name="bando" value="sith">
                    <label for="sith">Sith</label>
                </td>
                <td>
                    <p>Selecciona tus habilidades:</p>
                    <input 
                        type="checkbox" 
                        id="fuerza" 
                        name="habilidades" 
                        value="fuerza"
                    >
                    <label for="fuerza">Uso de la Fuerza</label><br>

                    <input 
                        type="checkbox" 
                        id="sable" 
                        name="habilidades" 
                        value="sable"
                    >
                    <label for="sable">Uso de Sable</label><br>

                    <input 
                        type="checkbox" 
                        id="levitar" 
                        name="habilidades" 
                        value="levitar"
                    >
                    <label for="levitar">Levitar</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="planeta">Planeta de Origen</label><br>
                    <select id="planeta" name="planeta" required>
                        <option value="">Selecciona un Planeta</option>
                        <option value="tatooine">Tatooine</option>
                        <option value="coruscant">Coruscant</option>
                        <option value="naboo">Naboo</option>
                    </select>
                </td>
                <td>
                    <label for="droide">Droide (puedes elegir varios)</label><br>
                    <select id="droide" name="droide" multiple size="3">
                        <option value="c3po">C3PO</option>
                        <option value="bb8">BB8</option>
                        <option value="r2d2">R2D2</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <fieldset>
                        <legend>Datos Generales</legend>
                        <label for="misiones">Misiones</label><br>
                        <input type="number" id="misiones" name="misiones"><br><br>
                        
                        <label for="vuelos">Vuelos</label><br>
                        <input type="number" id="vuelos" name="vuelos">
                    </fieldset>
                </td>
            </tr>
        </table>

        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Restablecer</button>
    </form>
</body>

</html>
