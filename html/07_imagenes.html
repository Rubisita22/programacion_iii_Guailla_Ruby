<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilización de la etiqueta img</title>
</head>
<body>
    <h1>Utilización de la etiqueta img</h1>

    <img 
      src="images/images.jpeg" 
      alt="Retrato del Maestro Yoda"
      width="350"
      height="350"
      loading="eager">

    <img 
      src="images/personajes/star.jpeg" 
      alt="Personajes de Star Wars"
      width="350"
      height="350"
      loading="eager">

    
    <figure>
      <img 
        src="../images/yoda1.jpeg" 
        alt="Maestro Yoda sentado"
        width="350"
        height="350"
        loading="eager">
      <figcaption>
        Maestro Yoda, integrante del consejo Jedi
      </figcaption>
    </figure>

   
    <a href="https://i.pinimg.com/1200x/b8/84/5b/b8845bc6e2ba0f4a216d0caa41aaa65e.jpg" target="_blank" rel="noopener noreferrer">
      <img 
        src="images/gatito.jpeg" 
        alt="Gatito tierno"
        width="350"
        height="350">
    </a>

</body>
</html>
