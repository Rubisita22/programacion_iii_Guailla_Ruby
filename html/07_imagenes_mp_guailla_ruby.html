<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilización de la etiqueta img</title>
</head>
<body>
<h1>Gestión de transporte público</h1>

<img 
src="images_mp_guailla_ruby/bus.jpeg"
alt="Bus urbano circulando por la ciudad"
width="450"
height="350"
loading="eager">

<img 
src="images_mp_guailla_ruby/transporte_mp_guailla_ruby/metro.jpeg"
alt="Estación de metro con pasajeros"
width="450"
height="350"
loading="eager">

<figure>
<img 
src="../images_mp_guailla_ruby/terminal.jpeg" 
alt="Terminal terrestre con buses estacionados"
width="350"
height="350"
loading="eager">
<figcaption>
        Terminal terrestre, punto central de la gestión de rutas y frecuencias
</figcaption>
</figure>

<a href="https://es.wikipedia.org/wiki/Transporte_p%C3%BAblico" target="_blank" rel="noopener noreferrer">
<img 
src="images_mp_guailla_ruby/parada.jpeg" 
alt="Parada de bus con pasajeros esperando"
width="450"
height="350">
</a>

</body>
</html>
