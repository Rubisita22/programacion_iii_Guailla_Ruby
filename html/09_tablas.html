<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas en HTML</title>
</head>

<body>
    <h1>Tablas en HTML</h1>

    <!-- Primera Tabla: Personajes de Snoopy -->
    <table id="personajes_snoopy" border="1">
        <caption>Tabla de Personajes de Snoopy</caption>
        <thead>
            <tr>
                <th colspan="3">Personaje</th>
            </tr>
            <tr>
                <th>Nombre</th>
                <th>Edad / Categoria</th>
                <th>Color</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Snoopy</td>
                <td>Amigo</td>
                <td>Blanco y Negro</td>
            </tr>
            <tr>
                <td>Papá</td>
                <td>30 años</td>
                <td>Blanco y Rosa</td>
            </tr>
            <tr>
                <td>Mamá</td>
                <td>20 años</td>
                <td>Blanco y Gris</td>
            </tr>
        </tbody>
    </table>

    <br>

    <!-- Segunda Tabla: Personajes de Rosita -->
    <table id="personajes_lindos" border="1">
        <caption>Tabla de Personajes de Rosita</caption>
        <thead>
            <tr>
                <th>Fresa</th>
                <th>Guayaba</th>
                <th>Labial</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fresa</td>
                <td>Guayaba</td>
                <td>Labial</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">Total misiones</th>
                <td>3</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
