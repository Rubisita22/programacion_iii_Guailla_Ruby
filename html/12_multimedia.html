<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <header>
        <h1>Recursos Multimedia</h1>
    </header>

    <main>
        <section>
            <h2>Reproducir Sonido</h2>
            <audio id="musica" src="music/music_demo.mp3" controls loop>
                Tu navegador no soporta el elemento de audio HTML5.
            </audio>
        </section>

        <section>
            <h2>Reproducir Video</h2>
            <video src="videos/video_demo.mp4" controls width="500">
                Tu navegador no soporta el elemento de video HTML5.
            </video>
        </section>

        <section>
            <h1>Portal Galáctico</h1>
            <h2>Información de la Academia Jedi</h2>
   
            <iframe src="https://www.starwars.com/"
                    width="600" 
                    height="350" 
                    title="Sitio oficial de Star Wars" 
                    loading="lazy">
            </iframe>

            <br><br>

            <iframe src="11_formulario_misiones.html"
                    width="600" 
                    height="350" 
                    title="Formulario de Misiones" 
                    loading="lazy">
            </iframe>
        </section>
    </main>
</body>
</html>
