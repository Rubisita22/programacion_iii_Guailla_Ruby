<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Transporte Público</title>
</head>

<body>
    <h1>Registro de Operadores y Unidades</h1>

    <form action="/registro-transporte" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre_conductor">Nombre del Conductor</label><br>
                    <input type="text" id="nombre_conductor" name="nombre_conductor" placeholder="Ej. Juan Pérez">
                </td>
                <td>
                    <label for="apellido_conductor">Apellido del Conductor</label><br>
                    <input type="text" id="apellido_conductor" name="apellido_conductor" placeholder="Ej. Gómez">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="cedula">Número de Cédula / DNI</label><br>
                    <input type="text" id="cedula" name="cedula" placeholder="1234567890">
                </td>
                <td>
                    <label for="licencia">Tipo de Licencia</label><br>
                    <select id="licencia" name="licencia" required>
                        <option value="">Selecciona una opción</option>
                        <option value="tipo_c">Tipo C (Buses pequeños)</option>
                        <option value="tipo_d">Tipo D (Buses urbanos)</option>
                        <option value="tipo_e">Tipo E (Articulados / Pesados)</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="experiencia">Años de Experiencia</label><br>
                    <input 
                        type="number" 
                        id="experiencia" 
                        name="experiencia" 
                        min="1" 
                        max="40" 
                        value="5"
                    >
                </td>
                <td>
                    <label for="capacidad_bus">Capacidad de la Unidad (pasajeros)</label><br>
                    <input 
                        type="number" 
                        id="capacidad_bus" 
                        name="capacidad_bus" 
                        min="20" 
                        max="200" 
                        value="80" 
                        step="10"
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <p>Modalidad de servicio:</p>
                    <input type="radio" id="urbano" name="modalidad" value="urbano">
                    <label for="urbano">Bus Urbano</label>

                    <input type="radio" id="brt" name="modalidad" value="brt">
                    <label for="brt">Corredor BRT</label>

                    <input type="radio" id="alimentador" name="modalidad" value="alimentador">
                    <label for="alimentador">Alimentador</label>
                </td>
                <td>
                    <p>Sistemas de seguridad equipados:</p>
                    <input 
                        type="checkbox" 
                        id="gps" 
                        name="seguridad" 
                        value="gps"
                    >
                    <label for="gps">Rastreo GPS</label><br>

                    <input 
                        type="checkbox" 
                        id="camaras" 
                        name="seguridad" 
                        value="camaras"
                    >
                    <label for="camaras">Cámaras de vigilancia</label><br>

                    <input 
                        type="checkbox" 
                        id="pago_electronico" 
                        name="seguridad" 
                        value="pago_electronico"
                    >
                    <label for="pago_electronico">Recaudo electrónico</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="ruta_asignada">Ruta Asignada</label><br>
                    <select id="ruta_asignada" name="ruta_asignada" required>
                        <option value="">Selecciona una Ruta</option>
                        <option value="ruta_1">Ruta 1: Norte - Sur</option>
                        <option value="ruta_2">Ruta 2: Centro - Oriente</option>
                        <option value="ruta_3">Ruta 3: Circunvalación</option>
                    </select>
                </td>
                <td>
                    <label for="turnos">Turnos Disponibles (puedes seleccionar varios)</label><br>
                    <select id="turnos" name="turnos" multiple size="3">
                        <option value="matutino">Matutino (05:00 - 13:00)</option>
                        <option value="vespertino">Vespertino (13:00 - 21:00)</option>
                        <option value="nocturno">Nocturno (21:00 - 05:00)</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <fieldset>
                        <legend>Datos Operativos del Vehículo</legend>
                        <label for="placa">Número de Placa</label><br>
                        <input type="text" id="placa" name="placa" placeholder="ABC-1234"><br><br>
                        
                        <label for="anio_unidad">Año de Fabricación</label><br>
                        <input type="number" id="anio_unidad" name="anio_unidad" min="2000" max="2026" value="2020">
                    </fieldset>
                </td>
            </tr>
        </table>

        <br>
        <button type="submit">Registrar Unidad</button>
        <button type="reset">Limpiar Formulario</button>
    </form>
</body>

</html>
