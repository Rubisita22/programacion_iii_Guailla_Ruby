<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones y Animaciones - Transporte</title>
    <link rel="stylesheet" href="18_transiciones_mp_guailla_ruby.css">
</head>
<body>
    <main>
        <h1>Centro de Control de Transporte</h1>
        <p>Coloca el cursor sobre el botón para iniciar despacho</p>
        <button class="boton-jedi">Despachar Unidad</button>
        
        <div class="tarjeta">
            <h2>Unidad A-102</h2>
            <p>Estado: En Servicio</p>
        </div>
        
        <br><br>
        
        <h1>Terminal Terrestre</h1>
        <div class="hangar">
            <div class="nave">Bus A-101</div>
        </div>

        <h1>Radar de Monitoreo GPS</h1>
        <div class="radar">
            <div class="indicador">⇒</div>
        </div>

        <h1>Estación de Transferencia</h1>
        <div class="hangar2">
            <div class="nave2">Bus B-205</div>
        </div>

        <h1>Monitoreo de Ruta Expresa</h1>
        <div class="espacio">
            <div class="xwing">Bus Expreso</div>
        </div>

        <div class="alerta">Alerta de Tráfico</div>
    </main>
</body>
</html>
