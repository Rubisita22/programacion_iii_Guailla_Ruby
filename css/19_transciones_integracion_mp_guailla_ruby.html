<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Flota - Sistema de Transporte</title>
    <link rel="stylesheet" href="19_transiciones_integracion_mp_guailla_ruby.css">
</head>
<body>

    <header>
        <h1>Control de Transporte Público</h1>
        <p>Simulación y seguimiento de unidades en tiempo real</p>
    </header>

    <main>

        <section class="escena" aria-label="Escena de monitoreo en ruta">

            <div class="estrella estrella1"></div>
            <div class="estrella estrella2"></div>
            <div class="estrella estrella3"></div>
            <div class="estrella estrella4"></div>
            <div class="estrella estrella5"></div>

            <div class="nave">
                <span aria-hidden="true">🚌</span>
                <p>Unidad A-102</p>
            </div>

            <div class="alerta">
                ALERTA DE TRÁFICO
            </div>

        </section>

        <section class="controles">

            <h2>Centro de Control Operativo</h2>

            <div class="panel">

                <article class="radar-contenedor">

                    <h3>Radar GPS de Ruta</h3>

                    <div class="radar" aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>

                </article>

                <article class="estado">

                    <h3>Estado de la Misión</h3>

                    <p>Monitoreo de flota activo</p>
                    <p>Unidad: Metrobus A-102</p>
                    <p>Base: Terminal Norte</p>

                </article>

            </div>

        </section>

    </main>

    <footer>
        <p>Red de Transporte Urbano - 2026</p>
    </footer>

</body>
</html>
